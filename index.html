<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TOOL TÀI XỈU BONIOS</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login-screen">
  <div class="login-box">
    <h1 class="login-title" id="loginTitle">TOOL TÀI XỈU BONIOS</h1>
    <p class="login-sub"><i class="fa-solid fa-shield-halved"></i> <span id="loginSub">Hệ Thống AI Phân Tích Dữ Liệu</span></p>

    <div class="login-avatar" id="avatarTrigger">
      <div class="login-avatar-ring"></div>
      <img id="loginAvatarImg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect fill='%23e0f2fe' width='200' height='200'/><text x='50%25' y='56%25' font-size='90' text-anchor='middle' dominant-baseline='middle'>🎀</text></svg>" alt="Avatar">
      <div class="login-online-dot"></div>
    </div>

    <div class="login-input-group">
      <i class="fa-solid fa-key icon-left"></i>
      <input type="password" id="keyInput" placeholder="Nhập Key..." autocomplete="off" spellcheck="false">
    </div>
    <button class="login-btn" id="btnLogin" onclick="doLogin()">
      <span class="login-spinner" id="loginSpinner"></span>
      <span id="btnText"><i class="fa-solid fa-right-to-bracket"></i> ĐĂNG NHẬP</span>
    </button>
    <div class="login-error" id="loginError"></div>
    <p class="login-footer">©<span id="loginFooter">TOOL•BONIOS</span></p>
  </div>
</div>

<!-- ===== TOOL SELECT ===== -->
<div id="tool-select">
  <div class="ts-header">
    <div class="ts-title" id="tsTitle">🎯 Chọn Tool</div>
    <div class="ts-sub" id="tsSub">Chọn tool AI bạn muốn mở</div>
    <div class="ts-tabs" id="tsTabs"></div>
  </div>
  <div class="ts-scroll">
    <div class="ts-grid" id="tsGrid"></div>
  </div>
  <button class="ts-logout" onclick="doLogout()"><i class="fa-solid fa-right-from-bracket"></i> ĐĂNG XUẤT</button>
</div>

<!-- ===== TOOL SCREEN ===== -->
<div id="tool-screen">
  <iframe id="gameFrame" src="about:blank" class="game-frame" allow="autoplay;fullscreen"></iframe>
  <button class="ts-back" onclick="backToSelect()"><i class="fa-solid fa-arrow-left"></i></button>
  <div class="ts-badge" id="tsBadge">TOOL</div>

  <div class="drag-group" id="dragPanel">
    <div class="predict-card" id="predictCard">
      <div class="card-header">
        <span class="card-title" id="cardTitle">AI PANEL</span>
        <button class="toggle-btn" onclick="togglePanel()">−</button>
      </div>
      <div class="card-body" id="cardBody">
        <span class="sid-value" id="sidValue">#@hk</span>
        <div class="tx-row">
          <div class="tx-circle tai" id="taiCircle">--%</div>
          <div class="tx-circle xiu" id="xiuCircle">--%</div>
        </div>
        <div class="conf-box" id="confBox"><span class="conf-level">--</span><span class="conf-num">0%</span></div>
        <div class="conf-bar"><div class="conf-bar-fill" id="confBar"></div></div>
        <div class="status-text" id="statusText">Đang kết nối...</div>
      </div>
    </div>
  </div>
</div>

<!-- ===== AVATAR MODAL ===== -->
<div id="avatar-modal" onclick="if(event.target===this)closeAvatarModal()">
  <div class="av-modal-box">
    <div class="av-modal-title">🎀 Đổi Avatar</div>
    <div class="av-modal-sub">Dán chuỗi Base64 ảnh</div>
    <div class="av-preview"><div class="av-preview-circle" id="avPreview">🎀</div></div>
    <textarea id="avBase64Input" placeholder="Dán Base64 hoặc URL ảnh..."></textarea>
    <div class="av-actions">
      <button class="av-btn-act av-btn-save" onclick="saveAvatar()"><i class="fa-solid fa-floppy-disk"></i> LƯU</button>
      <button class="av-btn-act av-btn-reset" onclick="resetAvatar()"><i class="fa-solid fa-rotate-left"></i> MẶC ĐỊNH</button>
    </div>
    <div class="av-status" id="avStatus"></div>
    <button class="av-modal-close" onclick="closeAvatarModal()">ĐÓNG</button>
  </div>
</div>

<script src="./js/config.js"></script>
<script src="./js/engine.js"></script>
<script src="./js/tools.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
